org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# O ':' precisa de escape em arquivos .properties (o Gradle tolera sem, mas o
# lint acusa). O java do PATH desta máquina é um Java 8 antigo, daí apontar
# explicitamente para o JBR do Android Studio.
org.gradle.java.home=D\:/Program Files/Android/Android Studio/jbr

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
